name: Build PharmaCalc Web

on:
  push:
    paths:
      - 'web/**'
      - 'data/**'
      - 'concrete/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 依存パッケージを入れる
        run: npm ci

      - name: ビルドして Concrete CMS のパッケージを作る
        run: npm run package

      # out/packages/pharmacalc を、サーバーの Concrete CMS の packages/ にそのまま置く
      - uses: actions/upload-artifact@v4
        with:
          name: PharmaCalc-web
          path: out/packages
          if-no-files-found: error
